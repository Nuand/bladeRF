[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bladerf"
dynamic = ["version"]
description = "CFFI-based Python 3 binding to libbladeRF"
readme = "README.md"
requires-python = ">=3"
license = "MIT"
authors = [
    {name = "Nuand LLC", email = "bladerf@nuand.com"},
]
keywords = ["bladerf", "sdr", "cffi", "radio", "libbladerf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
]
dependencies = ["cffi"]

[project.optional-dependencies]
numpy = ["numpy"]

[project.scripts]
bladerf-tool = "bladerf._tool:main"

[project.urls]
"Bug Reports" = "https://github.com/Nuand/bladeRF/issues"
Source = "https://github.com/Nuand/bladeRF"
Nuand = "https://nuand.com"

[tool.setuptools.packages.find]
include = ["bladerf*"]

[tool.setuptools.dynamic]
version = {attr = "bladerf.__version__"}
